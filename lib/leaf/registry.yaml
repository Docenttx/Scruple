# Scruple witness-leaf field registry.
#
# Modelled on OpenTelemetry's semantic conventions
# (/data/oss-study/otel-semconv/model/http/registry.yaml, and
# http/deprecated/registry-deprecated.yaml for the rename pattern).
# Adopt the mechanics, not the extensibility posture: OTel's registry
# governs an open-ended attribute namespace anyone may extend, and a
# Scruple leaf is a small, closed, security-relevant record. Nothing
# here is optional-by-convention; a field is either in the record or it
# is not evidence.
#
# THIS FILE IS THE SOURCE OF TRUTH. `lib/leaf/registry.generated.ts` is
# derived from it by `npm run gen:leaf-registry`, and
# `test/v2/leaf-registry.test.ts` fails if the two disagree.
#
# WHY YAML AND NOT TYPESCRIPT
# The registry has to be readable by a Python emitter (WO-3's neighbour)
# and by a third-party verifier who is not running our toolchain. A .ts
# registry would make the TypeScript side trivially easier and the other
# two impossible. js-yaml is already in the tree; the burden was one
# devDependency line.
#
# WHERE A PYTHON EMITTER HOOKS IN
# `yaml.safe_load(open("lib/leaf/registry.yaml"))` gives the identical
# structure `lib/leaf/generate.mjs` consumes — same keys, same shapes,
# no TS-specific nesting anywhere below. A `lib/leaf/generate.py` that
# walks `groups[].attributes[]` and emits dataclasses is ~60 lines and
# needs no coordination with this file beyond keeping `schema_version`.
# Emit into packages/scruple-host-sdk/ from THERE, not from here.

schema_version: 1

# ── Surfaces ────────────────────────────────────────────────────────────
# A leaf field does not exist in one place. It is submitted on one wire,
# folded into a hashed preimage, stored in a column, and returned on
# another wire — and the four names have already drifted twice (see the
# `aliases` on output_hash and signer_surrogate). Naming the surfaces is
# what makes that drift expressible instead of surprising.
surfaces:
  submit:
    brief: "Request body of POST /api/witness on the witness server."
    emitted_by:
      - services/witness-server/server.js  # handleWitness destructuring
      - app/api/v2/witness/route.ts        # witness.witnessIteration({...})
  record:
    brief: >-
      The canonical leaf preimage. sha256 of this is leaf_hash, which is
      what gets Merkled, anchored and signed. Field ORDER is part of the
      protocol; see leaf_schemes below.
    emitted_by:
      - services/witness-server/server.js  # canonicalRecord / canonicalRecordV22
  response:
    brief: "Response body of POST /api/witness on the witness server."
    emitted_by:
      - services/witness-server/server.js  # send(res, 200, {...})
  storage:
    brief: "Columns of the witness server's `witnesses` table."
    emitted_by:
      - services/witness-server/server.js  # INSERT INTO witnesses

# ── Leaf schemes ────────────────────────────────────────────────────────
# The preimage is a fixed-order JSON object, so the order below IS the
# protocol. An audit replay picks its form from the row's leaf_scheme.
leaf_schemes:
  v1:
    brief: >-
      No canonical record at all — leaf_hash is the bare output hash.
      Produced when the witness server is unreachable and capture
      degrades rather than blocking. Not a scheme so much as the absence
      of one, and named here so `leaf_scheme: 'v1'` is never read as a
      weaker v2.
    record_order: []
  v2:
    brief: "Pre-WO-8. No machine_manifest_hash slot."
    record_order:
      - run_sequence
      - output_hash
      - input_hash
      - workflow_hash
      - model_fingerprints_hash
      - server_timestamp
      - prev_record_hash
  v2.2:
    brief: >-
      Adds machine_manifest_hash between model_fingerprints_hash and
      server_timestamp. Selected by the PRESENCE of a non-empty
      machine_manifest_hash on the submit surface, not by a version flag.
    record_order:
      - run_sequence
      - output_hash
      - input_hash
      - workflow_hash
      - model_fingerprints_hash
      - machine_manifest_hash
      - server_timestamp
      - prev_record_hash

# ── Canonicalization profiles ───────────────────────────────────────────
# A leaf scheme says WHICH FIELDS enter a preimage and in what order. It
# says nothing about how a field's own document is turned into bytes, and
# that omission is what WO-21 was sent to fix: `workflow_hash`'s preimage
# said "recursive key sort, no whitespace" and left every scalar to the
# host language's JSON number formatter. `1e-5` is `0.00001` under
# JavaScript and `1e-05` under Python, so two conforming implementations
# computed different hashes for one document and each one's leaves failed
# verification against the other — indistinguishable from tampering.
#
# The two axes are orthogonal and are named separately so a future change
# to either is a bump rather than an edit. A leaf's replay needs BOTH: the
# scheme for the field order, the profile for the bytes.
canonicalization_profiles:
  insertion-order-1:
    brief: >-
      `JSON.stringify(doc)` in the object's own key order. What
      `workflow_hash` was before ec188d6 (2026-07-13, "WO-A2 canonical
      workflow_hash — sorted keys, whitespace-free").
    status: superseded
    replay_only: true
    found_by: >-
      WO-21, while looking for leaves the number-formatting bug had
      damaged. It found an older break instead. `data/scruple.db` holds
      seven rows with a workflow_hash; FOUR of them — ids 166..169,
      written 2026-07-05 — are not reproducible under the preimage this
      registry documents, in either language. Their `input_hash`
      reproduces exactly from the same stored spec, which proves the
      document is intact and the FORMULA is what changed.
    the_actual_defect: >-
      ec188d6 was the right change and it shipped WITHOUT a version
      marker. Those four rows carry `leaf_scheme: 'v2.2'`, identical to
      the rows written after it, so nothing in the record tells an
      auditor which rule to replay — and replaying them under the
      documented preimage produces a mismatch that reads as tampering.
      This section exists because the estate has now demonstrated it will
      change a preimage rule again.
    replayability: >-
      Both languages happen to reproduce all four, because these graphs
      are keyed "3", "4", "5"… and numeric-like keys order the same way
      under V8's object ordering and Python's insertion order. A
      COINCIDENCE OF THIS CORPUS, not a property of the profile: a
      pre-2026-07-13 graph with non-numeric top-level keys would be
      reproducible only in the serializer that wrote it.
    implementations:
      - lib/leaf/canonicalJson.ts#canonicalizeInsertionOrder   # replay only
    fixtures: >-
      All four rows, with their graphs, are in
      test/vectors/canonicalization-vectors.json under
      `legacy_leaves[].profile = insertion-order-1`, and both suites
      assert both halves: that the old rule reproduces them and that the
      current rule does not.

  legacy-1:
    brief: >-
      What shipped before WO-21. Recursive key sort by UTF-16 code unit,
      arrays in order, no whitespace, scalars via JavaScript
      `JSON.stringify`. Complete for structure and undefined for numbers,
      because it delegated them to the host language.
    status: superseded
    replay_only: true
    known_defects:
      - >-
        Number formatting was whatever the implementing language did. The
        divergence is measured in docs/canon/CANONICALIZATION.md §2.
      - >-
        NaN and Infinity serialised to `null` — a false record, not a
        refusal.
      - >-
        `undefined` produced the literal text `undefined` and a sparse
        array produced `[1,,2]`, neither of which is JSON, so no verifier
        in any language could reproduce the hash.
      - >-
        A Date, a Map or any class instance canonicalized to `{}` and the
        hash committed to nothing.
    implementations:
      - lib/leaf/canonicalJson.ts#canonicalizeLegacy   # replay only

  jcs-1:
    brief: >-
      RFC 8785, the JSON Canonicalization Scheme. Numbers per ECMA-262
      §7.1.12.1 (§3.2.2.3), property names sorted as arrays of UTF-16 code
      units (§3.2.3), string escaping per §3.2.2.2, NaN and Infinity
      refused. Every JSON number is an IEEE-754 double, so `1` and `1.0`
      are the same value and canonicalize identically.
    status: current
    spec: "RFC 8785 §3.2.2.2, §3.2.2.3, §3.2.3"
    implementations:
      - lib/leaf/canonicalJson.ts                       # TypeScript
      - packages/scruple-api/scruple_api/canonical.py   # Python
    vectors: test/vectors/canonicalization-vectors.json
    why_no_leaf_scheme_bump: >-
      RFC 8785 mandates ECMAScript's own Number::toString and a UTF-16
      code-unit key sort, which is exactly what `JSON.stringify` and
      `Array#sort` were already doing. jcs-1 and legacy-1 are therefore
      BYTE-IDENTICAL over every document that is valid JSON, and no leaf
      that exists changed value. The behaviour that changed is refusal:
      four classes of non-JSON value that legacy-1 answered for, wrongly
      and silently, now raise. The claim is not an argument — it is
      pinned by `legacy_leaves` in the vector file, which carries hashes
      captured from the pre-WO-21 implementation for eight real
      documents, two of them witnessed rows.
    known_limits:
      - >-
        An integer outside the exactly-representable double range cannot
        be reconciled. Python sees `9007199254740993` exactly and REFUSES;
        JavaScript's parser has already rounded it to ...992 before the
        canonicalizer is called and cannot detect the loss. The asymmetry
        is in the vectors as `python_refuses`, not smoothed over.
      - >-
        Applies to `workflow_hash` ONLY. `input_hash` and
        `model_fingerprints_hash` are still in the host language's
        formatter, and model_fingerprints carries a float `mtime` per
        file. Correcting those IS a scheme bump, because unlike
        workflow_hash their shipped preimage is not canonical JSON under
        any spec. Recorded in docs/canon/CANONICALIZATION.md §7.

groups:
  - id: registry.witness-leaf
    type: attribute_group
    brief: "Canonical fields of a Scruple witness leaf."
    attributes:

      # ── Identity and ordering ──────────────────────────────────────
      - id: project_id
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v1
        surfaces: [submit, storage]
        brief: >-
          Chain identity. Every leaf's prev_record_hash is looked up
          within this id, so two callers sharing one project_id share one
          chain. The production witness REFUSES ids prefixed `tenant:` or
          `baseline:` — those are generated by the /v2 canon surface and
          their arrival means a developer is pointed at production.

      - id: project_name
        type: string
        stability: stable
        requirement_level: opt_in
        introduced_in: v1
        surfaces: [submit, storage]
        brief: "Display name. Audit-log convenience; not in the preimage."

      - id: run_sequence
        type: int
        stability: stable
        requirement_level: required
        introduced_in: v1
        surfaces: [submit, record, storage]
        brief: >-
          Position in the project's chain, 1-based. In the preimage, so a
          leaf cannot be reordered after the fact. Hardcoding it to a
          constant does not fail on the first call, only on the second —
          which is how it survived in two separate code paths.

      # ── The five hashes ────────────────────────────────────────────
      - id: output_hash
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v1
        surfaces: [submit, record, storage]
        aliases:
          submit: content_hash
          storage: content_hash
        preimage: "sha256 of the raw output bytes."
        brief: >-
          The artifact itself. NOTE THE ALIASES. The wire says
          content_hash and the `witnesses` column says content_hash; only
          the PREIMAGE says output_hash — so the one name that appears
          nowhere a developer normally looks is the one the evidence is
          built from. Found by writing this registry, not by debugging:
          the first draft assumed the column matched the preimage, and
          the drift guard said otherwise on its first run. Recorded
          rather than reconciled — see the deprecated group.

      - id: input_hash
        type: string
        stability: stable
        requirement_level: recommended
        introduced_in: v2
        surfaces: [submit, record, storage]
        preimage: >-
          sha256(JSON.stringify({provider, prompt, spec, inputs})) with
          the keys in that literal order and each input reduced to
          {kind, hash}. NOT canonical (recursively key-sorted) JSON, and
          NOT canonicalization_profile jcs-1 — this is what shipped and
          existing leaves commit to it. Every value in it is a string
          today, so the number divergence WO-21 fixed in workflow_hash
          cannot bite here; that is a property of the current field set,
          not a guarantee of the formula.
          lib/leaf/hashes.ts#hashRunInputs is the only implementation.
          The /v2 surface passes null for provider/prompt/spec because
          it is zero-content and never receives them.
        brief: "Binds every input artifact that fed the run."

      - id: workflow_hash
        type: string
        stability: stable
        requirement_level: recommended
        introduced_in: v2
        surfaces: [submit, record, storage]
        preimage: >-
          sha256(canonicalize(doc)) under canonicalization profile
          `jcs-1` — RFC 8785, implemented in lib/leaf/canonicalJson.ts and
          packages/scruple-api/scruple_api/canonical.py, with shared
          vectors in test/vectors/canonicalization-vectors.json. Recursive
          key sort by UTF-16 code unit, arrays keep order (ComfyUI wiring
          tuples are positional), no whitespace, numbers per ECMA-262
          Number::toString. `doc` is the ComfyUI workflow_api_json for
          kind=graph_execute, and the training recipe for kind=model_write:
          on a training run the recipe is what the graph is on a generation
          run. `kind` tells a verifier which document to re-canonicalize.
          Leaves written before WO-21 carry the same bytes — see
          canonicalization_profiles.jcs-1.why_no_leaf_scheme_bump.
        brief: "Binds the graph, or the training recipe, that produced the output."

      - id: model_fingerprints_hash
        type: string
        stability: stable
        requirement_level: recommended
        introduced_in: v2
        surfaces: [submit, record, storage]
        preimage: >-
          sha256(JSON.stringify(manifest)) with TOP-LEVEL keys sorted
          ascending and nested per-file objects left in their original
          key order. Deliberately not recursive; see lib/leaf/hashes.ts.
          Absent or empty manifest hashes to NULL, never to the hash of
          {} — "we looked and found none" is a claim, and an unpopulated
          field must not make it.

          NOT canonicalization_profile jcs-1, and this is a live gap
          rather than a settled choice. The formula is the host language's
          own JSON serializer, and the manifest carries a float `mtime`
          per file, so a Python verifier and this server can disagree on
          an integral mtime exactly the way they disagreed on a learning
          rate — measured in docs/canon/CANONICALIZATION.md §7. Every
          fingerprint manifest in the current corpus reproduces in both
          languages; the exposure is real and unrealised. Fixing it is a
          leaf-scheme bump, because unlike workflow_hash the shipped
          preimage is not canonical JSON under any spec.
        brief: "Binds the actual weights loaded, not the filenames asked for."

      - id: machine_manifest_hash
        type: string
        stability: stable
        requirement_level: conditionally_required
        condition: >-
          Present whenever the toolchain is pinned. Its presence is what
          selects leaf_scheme v2.2 over v2, so it is not a free-form
          optional: supplying it changes the preimage shape.
        introduced_in: v2.2
        surfaces: [submit, record, storage]
        brief: "Binds the custom-node pack manifest the workflow ran on."

      - id: visual_hash
        type: string
        stability: stable
        requirement_level: opt_in
        introduced_in: v1
        surfaces: [submit, storage]
        brief: >-
          Perceptual hash. Stored, never in the preimage — a fuzzy hash
          in a tamper-evidence record would make the record fuzzy.

      # ── Time and chaining ──────────────────────────────────────────
      - id: client_timestamp
        type: string
        stability: stable
        requirement_level: recommended
        introduced_in: v1
        surfaces: [submit, storage]
        brief: >-
          When the caller says it happened. Not in the preimage: the
          caller is the party the leaf is evidence about.

      - id: server_timestamp
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v1
        surfaces: [record, response, storage]
        brief: "When the witness saw it. This is the one in the preimage."

      - id: prev_record_hash
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v2
        surfaces: [record, response, storage]
        brief: >-
          The previous leaf_hash in this project's chain, '' at genesis.
          What makes the sequence append-only rather than merely ordered.

      # ── Identity of the leaf, and its seals ────────────────────────
      - id: witness_id
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v1
        surfaces: [response, storage]
        brief: "Opaque id, `wit_` + 8 random bytes."

      - id: leaf_hash
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v2
        surfaces: [response, storage]
        brief: "sha256 of the canonical record. The Merkled leaf."

      - id: leaf_scheme
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v2
        surfaces: [response, storage]
        brief: >-
          Which record_order above reproduces leaf_hash. Without it an
          auditor cannot replay a historical leaf at all.

      - id: signature
        type: string
        stability: stable
        requirement_level: required
        introduced_in: v1
        surfaces: [response, storage]
        brief: >-
          HMAC over leaf_hash. H-2 demoted this to a TRANSPORT SEAL
          between the application tier and the witness; it is not an
          evidence claim, because both parties hold the key. Kept under
          its original name rather than renamed, because renaming it
          would make old rows and new rows look like different things
          when they are the same thing.

      - id: leaf_signature
        type: string
        stability: development
        requirement_level: recommended
        introduced_in: v2.4
        surfaces: [response, storage]
        brief: >-
          H-1. Base64 DER ECDSA P-256 over the raw bytes of leaf_hash —
          the seal a third party can check without Scruple. NULL when
          signing is disabled or the KMS is unreachable, because losing
          the event would be worse than recording one whose independent
          verifiability is pending. `stability: development` is not
          hedging: nothing on the scruple-web side reads it yet
          (migration 041 is unwritten), so it is defined-and-not-wired
          and the registry says so rather than leaving it to be
          discovered.

      - id: leaf_signer_key_id
        type: string
        stability: development
        requirement_level: recommended
        introduced_in: v2.4
        surfaces: [response, storage]
        brief: "Which key signed. Also unread on the scruple-web side."

      - id: leaf_signature_alg
        type: string
        stability: development
        requirement_level: recommended
        introduced_in: v2.4
        surfaces: [response, storage]
        brief: "Signature algorithm. Also unread on the scruple-web side."

      - id: signer_surrogate
        type: boolean
        stability: development
        requirement_level: recommended
        introduced_in: v2.4
        surfaces: [response, storage]
        aliases:
          storage: leaf_signer_surrogate
        brief: >-
          True when a software surrogate key signed rather than the
          vault key. NOTE THE ALIAS — this is the drift WO-1 was sent to
          settle. The wire says signer_surrogate; the column says
          leaf_signer_surrogate. Reading the column name off the wire
          yields undefined forever, and WitnessIterationResult's index
          signature means TypeScript will not object.

      - id: independently_verifiable
        type: boolean
        stability: development
        requirement_level: recommended
        introduced_in: v2.4
        surfaces: [response]
        brief: >-
          Whether an asymmetric signature exists at all. Response-only by
          design: it is derived from leaf_signature, and a stored copy
          could disagree with the field it summarises.

  # ── Deprecated / renamed ────────────────────────────────────────────
  # OTel's rename pattern. Every name that has ever meant one of the
  # fields above resolves here, so a reader who finds an old name in a
  # log, a column, or someone's client gets pointed at the live one
  # instead of concluding the field does not exist.
  - id: registry.witness-leaf.deprecated
    type: attribute_group
    brief: "Names that resolve to a live field under a different id."
    attributes:
      - id: leaf_signer_surrogate
        type: boolean
        stability: development
        requirement_level: opt_in
        introduced_in: v2.4
        surfaces: []
        deprecated:
          reason: renamed
          renamed_to: signer_surrogate
          note: >-
            Storage-side spelling only. NOT reconciled, deliberately:
            changing the wire field is breaking, and while a grep found
            no consumer inside this repo, the deployed witness
            (2026-07-16 build) predates H-1 entirely and any external
            verifier written against the current wire would break for a
            cosmetic gain. Recorded, guarded by
            test/v2/leaf-registry.test.ts, and left alone.
        brief: "See signer_surrogate."

      - id: content_hash
        type: string
        stability: stable
        requirement_level: opt_in
        introduced_in: v1
        surfaces: []
        deprecated:
          reason: renamed
          renamed_to: output_hash
          note: >-
            The spelling used on BOTH the wire and the `witnesses`
            column; `output_hash` exists only inside the canonical
            record. Same reasoning as leaf_signer_surrogate — a live
            wire field is not renamed for tidiness — with more force
            here, because renaming the column would also rewrite the
            table every existing leaf lives in.
        brief: "See output_hash."
