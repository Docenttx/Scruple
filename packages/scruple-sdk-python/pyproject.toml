[project]
name = "scruple"
version = "0.1.0"
description = "Scruple SDK — baseline manifest, attestation envelope, and witness client for integrating with the Scruple witnessing API."
authors = [{ name = "Docent Technologies LLC" }]
license = { text = "UNLICENSED" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scruple", "scruple.attestation"]
