[project]
name = "scruple-api"
version = "0.1.0"
description = "Scruple instrumentation API: interfaces, outcome types, the MIME gate, the modality vocabulary, the capture-surface contract, and a validating no-op. No network capability -- nothing in this package can open a socket. Pure standard library."
requires-python = ">=3.10"

# DELIBERATELY EMPTY, and for one more reason than scruple-host-sdk has.
# These modules run inside embedded interpreters where pip cannot be
# assumed, so `cp -r scruple_api/` has to be a valid install. On top of
# that, this package's whole claim is that vendoring it into any code path
# carries no network risk -- a claim a transitive dependency would silently
# void. tests/test_no_network_capability.py enforces both halves.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scruple_api*"]
