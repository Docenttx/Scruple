#cloud-config
#
# Cloud-init user-data for the Scruple Signer CVM — Oracle Linux 9 variant.
#
# Preferred for production over the Ubuntu variant because Oracle Linux's
# package mirror is served from `yum.oracle.com` and REGIONAL clones like
# `iad-ad-1.clouds.archive.oracle.com` — both included in OCI's "All IAD
# Services in Oracle Services Network" aggregate. Package installs work
# through the Service Gateway alone; NO NAT Gateway needed; no
# general-Internet egress from the private subnet. This is the "golden
# image" security pattern: private subnet has ZERO outbound to the
# Internet, only to OCI-native services.
#
# Runs on first boot inside the OCI SEV-SNP Confidential VM. Fully
# unattended SoftHSM ceremony:
#
#   1. Adds BOTH the user's admin key AND the Web-host driver key to
#      opc@authorized_keys (Oracle Linux default user is 'opc', not 'ubuntu')
#   2. Installs softhsm, openssl-pkcs11, python3.12, oci-cli, c2pa-python
#      (all via Oracle's yum mirror, reached via Service Gateway)
#   3. Creates the scruple-signer OS user with per-user token store
#   4. Fetches the SoftHSM PIN from OCI Vault via Instance Principal
#   5. Initializes the SoftHSM token
#   6. Generates the ES256 signing key with CKA_EXTRACTABLE=false
#   7. Exports pubkey (DER + PEM + sha256 for attestation binding)
#   8. Writes done-marker at /var/log/scruple-cvm-bootstrap.done
#
# CVM launch requirements when using this variant:
#   - Image: Oracle Linux 9 (latest — search "Oracle-Linux-9" in image picker)
#   - SSH default user is 'opc' not 'ubuntu' (adjust SSH commands accordingly)
#   - Everything else identical to the Ubuntu variant

users:
  - default
  - name: opc
    ssh_authorized_keys:
      - ssh-rsa  ssh-key-2026-03-16
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK6ru5WZfxML6qHvfBGYss9lNfh/u0kNTymyPrb9kk3U scruple-signer-drive 20260715

# Oracle Linux uses yum/dnf, not apt. All packages available from the
# oracle-linux-9 base repos which are mirrored inside OCI Services Network.
package_upgrade: false

yum_repos:
  ol9_developer_EPEL:
    baseurl: https://iad-ad-1.clouds.archive.oracle.com/ol9/developer/EPEL/x86_64/
    enabled: true
    gpgcheck: false
    name: "Oracle Linux 9 EPEL - x86_64 (regional OCI mirror, reached via SGW)"

packages:
  - softhsm
  - opensc
  - openssl-pkcs11
  - python3.12
  - python3.12-pip
  - openssl
  - jq
  - curl

write_files:
  # SoftHSM config pointing at per-user token store
  - path: /etc/softhsm2.conf
    permissions: '0644'
    content: |
      directories.tokendir = /var/lib/scruple-signer/softhsm/tokens
      objectstore.backend = file
      log.level = INFO
      slots.removable = false
      slots.mechanisms = ALL
      library.reset_on_fork = false

  # First-boot bootstrap script
  - path: /usr/local/sbin/scruple-signer-bootstrap.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/scruple-cvm-bootstrap.log) 2>&1
      echo "=== Scruple Signer bootstrap starting at $(date -u -Iseconds) ==="

      PIN_OCID='ocid1.vaultsecret.oc1.iad.amaaaaaazjtltxiafzm4lv7lczdeq4zewjpsddhlpmee6xm5z7fnedgf2jma'
      export OCI_CLI_AUTH=instance_principal
      export SOFTHSM2_CONF=/etc/softhsm2.conf

      echo "--- Creating scruple-signer OS user ---"
      if ! id scruple-signer &>/dev/null; then
        useradd --system --shell /sbin/nologin \
            --home-dir /var/lib/scruple-signer --create-home scruple-signer
      fi
      install -d -o scruple-signer -g scruple-signer -m 0700 \
          /var/lib/scruple-signer/softhsm \
          /var/lib/scruple-signer/softhsm/tokens

      echo "--- Installing OCI CLI + c2pa-python in a venv ---"
      python3.12 -m venv /opt/scruple-venv
      /opt/scruple-venv/bin/pip install --upgrade pip
      /opt/scruple-venv/bin/pip install 'oci-cli' \
          'c2pa==0.36.0' 'cryptography==42.0.5' 'oci==2.129.1'
      ln -sf /opt/scruple-venv/bin/oci /usr/local/bin/oci

      echo "--- Fetching SoftHSM PIN from OCI Vault via Instance Principal ---"
      for attempt in 1 2 3 4 5; do
        if PIN=$(oci secrets secret-bundle get --secret-id "$PIN_OCID" \
              --raw-output --query 'data."secret-bundle-content".content' 2>/dev/null | base64 -d); then
          break
        fi
        echo "  PIN fetch attempt $attempt failed; retrying in 15s"
        sleep 15
      done
      if [ -z "${PIN:-}" ]; then
        echo "FATAL: could not fetch PIN from OCI Vault after 5 attempts"
        exit 1
      fi
      echo "  PIN retrieved (${#PIN} chars)"

      echo "--- Initializing SoftHSM token ---"
      sudo -u scruple-signer -E env SOFTHSM2_CONF=$SOFTHSM2_CONF \
          softhsm2-util --init-token --slot 0 \
              --label 'scruple-c2pa' \
              --pin "$PIN" --so-pin "$PIN"

      echo "--- Generating ES256 signing key (non-extractable) ---"
      sudo -u scruple-signer -E env SOFTHSM2_CONF=$SOFTHSM2_CONF \
          pkcs11-tool --module /usr/lib64/pkcs11/libsofthsm2.so \
              --slot-index 0 --login --pin "$PIN" \
              --keypairgen \
              --key-type EC:prime256v1 \
              --label 'scruple-c2pa-key' --id 01 \
              --usage-sign \
              --sensitive --extractable=false

      echo "--- Exporting pubkey for attestation binding ---"
      sudo -u scruple-signer -E env SOFTHSM2_CONF=$SOFTHSM2_CONF \
          pkcs11-tool --module /usr/lib64/pkcs11/libsofthsm2.so \
              --slot-index 0 --login --pin "$PIN" \
              --read-object --type pubkey \
              --label 'scruple-c2pa-key' \
              --output-file /var/lib/scruple-signer/scruple-c2pa-pubkey.der
      openssl ec -inform DER -pubin \
          -in /var/lib/scruple-signer/scruple-c2pa-pubkey.der \
          -pubout -out /var/lib/scruple-signer/scruple-c2pa-pubkey.pem
      sha256sum /var/lib/scruple-signer/scruple-c2pa-pubkey.der \
          | awk '{print $1}' > /var/lib/scruple-signer/scruple-c2pa-pubkey.sha256
      chown scruple-signer:scruple-signer /var/lib/scruple-signer/scruple-c2pa-pubkey.*

      unset PIN

      echo "--- Verifying key generated correctly ---"
      sudo -u scruple-signer -E env SOFTHSM2_CONF=$SOFTHSM2_CONF \
          pkcs11-tool --module /usr/lib64/pkcs11/libsofthsm2.so \
              --slot-index 0 --list-objects || true

      echo "=== Scruple Signer bootstrap COMPLETE at $(date -u -Iseconds) ==="
      touch /var/log/scruple-cvm-bootstrap.done

runcmd:
  - bash /usr/local/sbin/scruple-signer-bootstrap.sh
