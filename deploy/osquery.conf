// Scruple L2 HIDS configuration for osquery on Ubuntu 24.04.
// Deploy target: /etc/osquery/osquery.conf
//
// Logger:  filesystem -> /var/log/osquery/ (primary).
//          To centralize (Kolide, Fleet, or OCI Logging), set logger_plugin
//          to "tls" and add tls_hostname / tls_endpoint /
//          enroll_secret_path / enroll_tls_endpoint options in this block.
// Config:  filesystem (this file).
//
// osquery accepts // and /* ... */ comments; trailing commas allowed.
{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "logger_path": "/var/log/osquery",
    "disable_logging": "false",
    "log_result_events": "true",
    "utc": "true",
    "host_identifier": "hostname",
    "schedule_splay_percent": "10",
    "schedule_default_interval": "3600",
    "worker_threads": "2",
    "disable_events": "false",
    "enable_file_events": "true",
    "events_expiry": "86400",
    "logger_min_status": "0",
    "audit_allow_config": "true",
    "audit_persist": "true"
  },

  "schedule": {
    // Detect tampering with the C2PA signer service source tree.
    // Direct threat: modified signer -> forged provenance receipts.
    "fim_signer_code": {
      "query": "SELECT target_path, action, atime, mtime, ctime, hashed, sha256 FROM file_events WHERE category = 'signer_code';",
      "interval": 60,
      "removed": false
    },

    // Detect tampering with the watermark service.
    // Protects watermark payload integrity end-to-end.
    "fim_watermark_code": {
      "query": "SELECT target_path, action, atime, mtime, ctime, hashed, sha256 FROM file_events WHERE category = 'watermark_code';",
      "interval": 60,
      "removed": false
    },

    // Detect tampering with in-app and external witness code.
    // Protects Merkle-log and checkpoint integrity.
    "fim_witness_code": {
      "query": "SELECT target_path, action, atime, mtime, ctime, hashed, sha256 FROM file_events WHERE category = 'witness_code';",
      "interval": 60,
      "removed": false
    },

    // Detect changes to scruple-* systemd units.
    // Persistence / privilege-escalation vector.
    "fim_systemd_units": {
      "query": "SELECT target_path, action, atime, mtime, ctime, hashed, sha256 FROM file_events WHERE category = 'systemd_units';",
      "interval": 60,
      "removed": false
    },

    // Detect edge-tunnel config tampering.
    // Could redirect ingress to attacker-controlled origin.
    "fim_cloudflared": {
      "query": "SELECT target_path, action, atime, mtime, ctime, hashed, sha256 FROM file_events WHERE category = 'cloudflared';",
      "interval": 60,
      "removed": false
    },

    // Self-monitor osquery config so an attacker cannot silently disable HIDS.
    "fim_osquery_self": {
      "query": "SELECT target_path, action, atime, mtime, ctime, hashed, sha256 FROM file_events WHERE category = 'osquery_self';",
      "interval": 60,
      "removed": false
    },

    // Detect authorized_keys tampering on root and every /home user.
    // Classic backdoor persistence.
    "fim_ssh_authorized_keys": {
      "query": "SELECT target_path, action, atime, mtime, ctime, uid, gid, hashed, sha256 FROM file_events WHERE category = 'ssh_keys';",
      "interval": 3600,
      "removed": false
    },

    // Hourly snapshot of listening sockets. Diff off-host against allowlist:
    // 22 (sshd), 3000 (dev), 3001 (Next.js), 5799 (witness).
    // Anything else is investigated.
    "listening_ports_snapshot": {
      "query": "SELECT pid, port, protocol, family, address, path FROM listening_ports WHERE port != 0;",
      "interval": 3600,
      "snapshot": true
    },

    // Daily snapshot of every setuid/setgid binary.
    // Off-host diff detects privilege-escalation seeding.
    "suid_sgid_binaries": {
      "query": "SELECT path, username, groupname, permissions, uid, gid, size, mtime FROM suid_bin;",
      "interval": 86400,
      "snapshot": true
    },

    // Every 5 minutes: any root-owned process whose executable name is not
    // in the platform allowlist. Off-list root execution is the strongest
    // early signal of compromise.
    "root_processes_offlist": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.uid, p.parent, p.start_time FROM processes p WHERE p.uid = 0 AND p.name NOT IN ('systemd','systemd-journald','systemd-logind','systemd-udevd','systemd-resolved','systemd-timesyncd','systemd-networkd','(sd-pam)','sshd','cloudflared','node','python3','scruple-c2pa-signer','scruple-witness','osqueryd','osqueryi','kthreadd','kworker','ksoftirqd','migration','rcu_sched','watchdog','init','agetty','dbus-daemon','cron','rsyslogd','snapd','multipathd','polkitd','unattended-upgr','packagekitd','networkd-dispat','chronyd','irqbalance');",
      "interval": 300
    },

    // Hourly kernel-module snapshot. Diff off-host to catch rootkit or
    // unauthorized LKM loads / unloads.
    "kernel_modules_snapshot": {
      "query": "SELECT name, size, used_by, status, address FROM kernel_modules;",
      "interval": 3600,
      "snapshot": true
    },

    // Every 5 minutes: sudo failures from shell/audit history.
    // Brute-force / lateral-movement indicator.
    "failed_sudo_attempts": {
      "query": "SELECT username, command, timestamp FROM sudo_history;",
      "interval": 300
    },

    // Daily snapshot of local users.
    // Off-host diff detects unauthorized account creation.
    "new_user_accounts": {
      "query": "SELECT uid, gid, username, description, directory, shell, uuid FROM users;",
      "interval": 86400,
      "snapshot": true
    },

    // Daily snapshot of every cron entry (per-user + system).
    // Persistence vector.
    "cron_changes": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 86400,
      "snapshot": true
    },

    // Daily snapshot of systemd unit files and other autostarts.
    // Persistence-vector complement to cron.
    "startup_items": {
      "query": "SELECT name, path, source, status, username FROM startup_items;",
      "interval": 86400,
      "snapshot": true
    }
  },

  // File integrity monitoring targets. Categories are referenced by the
  // file_events queries above. Trailing %% recurses; % is a single-segment
  // wildcard. Excludes below suppress noise from build artifacts / caches.
  "file_paths": {
    "signer_code": [
      "/data/scruple-web/services/c2pa-signer/%%"
    ],
    "watermark_code": [
      "/data/scruple-web/services/watermark/%%"
    ],
    "witness_code": [
      "/data/scruple-web/lib/witness/%%",
      "/opt/scruple-witness/%%"
    ],
    "systemd_units": [
      "/etc/systemd/system/scruple-%.service"
    ],
    "cloudflared": [
      "/etc/cloudflared/%%"
    ],
    "osquery_self": [
      "/etc/osquery/%%"
    ],
    "ssh_keys": [
      "/root/.ssh/authorized_keys",
      "/home/%/.ssh/authorized_keys"
    ]
  },

  // Emit an event when these categories are opened for read as well as
  // written -- catches attackers exfiltrating keys or reading config.
  "file_accesses": [
    "ssh_keys",
    "osquery_self"
  ],

  "exclude_paths": {
    "signer_code": [
      "/data/scruple-web/services/c2pa-signer/node_modules/%%",
      "/data/scruple-web/services/c2pa-signer/target/%%",
      "/data/scruple-web/services/c2pa-signer/.venv/%%",
      "/data/scruple-web/services/c2pa-signer/__pycache__/%%"
    ],
    "watermark_code": [
      "/data/scruple-web/services/watermark/node_modules/%%",
      "/data/scruple-web/services/watermark/.venv/%%",
      "/data/scruple-web/services/watermark/__pycache__/%%"
    ],
    "witness_code": [
      "/data/scruple-web/lib/witness/node_modules/%%",
      "/opt/scruple-witness/node_modules/%%",
      "/opt/scruple-witness/arlocal-data/%%"
    ]
  }

  // TODO: enable stock packs from osquery-launcher distribution if desired.
  //   "packs": {
  //     "incident-response": "/etc/osquery/packs/incident-response.conf",
  //     "vuln-management":   "/etc/osquery/packs/vuln-management.conf"
  //   }
}
